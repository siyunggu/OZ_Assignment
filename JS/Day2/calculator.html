
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>콘솔창 계산기 프로그램</title>
</head>


<body>
    <h1>콘솔창 계산기 프로그램</h1>

    <h3>Window OS의 경우</h3>
    <hr>
    <p>1. F12 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>

    <h3>Mac OS의 경우</h3>
    <hr>
    <p>1. Option + Command + J 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>

    <script>
        function start() {
            let expression = prompt("계산식을 입력하세요. (예: 1 + 1 * 4)");  //계산하는 창 띄우기

            if (expression === null) {
                return;
            }

            if (expression.trim() === "") {
                alert("계산식을 입력하세요.");
                return;
            }

            if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
                alert("올바른 계산식을 입력하세요.");
                return;
            }

            try {
                let result = eval(expression);    //입력한 계산식  계산

                if (!Number.isFinite(result)) {
                    alert("계산할 수 없는 결과입니다.");
                    return;
                }

                alert("계산 결과: " + result);
            } catch (error) {
                alert("잘못된 계산식입니다.");
            }
        }
    </script>
</body>
</html>
